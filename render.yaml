services:
  - type: web
    name: spring-boot-investment-api
    runtime: java
    plan: free
    buildCommand: ./mvnw clean package
    startCommand: java -jar target/investment-app-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Add more environment variables below as needed
      # - key: YOUR_VAR
      #   value: your_value
